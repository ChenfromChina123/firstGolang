<?xml version="1.0" encoding="UTF-8"?>
<!-- FileSync 首页 banner：横向装饰条，含网格 + 同步光效 + 标语占位 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0d1320"/>
            <stop offset="50%" stop-color="#0a0e14"/>
            <stop offset="100%" stop-color="#0d1320"/>
        </linearGradient>
        <linearGradient id="bannerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" fill="none" stroke="#1c2536" stroke-width="0.5" opacity="0.4"/>
        </pattern>
    </defs>

    <rect width="1200" height="180" fill="url(#bannerBg)"/>
    <rect width="1200" height="180" fill="url(#grid)"/>

    <ellipse cx="300" cy="90" rx="280" ry="120" fill="url(#glow)"/>
    <ellipse cx="900" cy="90" rx="280" ry="120" fill="url(#glow)" opacity="0.6"/>

    <line x1="0" y1="90" x2="1200" y2="90" stroke="url(#bannerAccent)" stroke-width="1"/>

    <!-- 同步循环箭头（中央） -->
    <g transform="translate(600,90)">
        <circle r="36" fill="none" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
        <path d="M-20 -8 A 22 22 0 0 1 20 -8" fill="none" stroke="#00d9ff" stroke-width="2" stroke-linecap="round"/>
        <path d="M14 -12 L20 -8 L14 -4" fill="none" stroke="#00d9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 8 A 22 22 0 0 1 -20 8" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
        <path d="M-14 12 L-20 8 L-14 4" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 左侧标语 -->
    <text x="80" y="80" font-family="'JetBrains Mono', monospace" font-size="13" fill="#7a8a9e" letter-spacing="3">FILESYNC · CHUNKED · SYNC</text>
    <text x="80" y="108" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#c8d3e0" letter-spacing="0.5">分片上传 · 断点续传 · 秒传</text>
    <text x="80" y="132" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5ae0c8" letter-spacing="1.5">HTTPS · JWT · SHA256 · BCRYPT</text>

    <!-- 右侧标语 -->
    <text x="1120" y="108" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7a8a9e" letter-spacing="2">v2026.07</text>
</svg>
