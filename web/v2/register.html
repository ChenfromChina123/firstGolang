<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563EB">
    <script src="/web/v2/theme.js"></script>
    <title>FileSync · 注册</title>
    <link rel="icon" href="/web/img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/web/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/v2/style.css?v=20260809-dark">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <img src="/web/img/logo.svg" alt="FileSync logo" class="login-logo">
                <h2>创建账号</h2>
                <p>注册后即可开始安全同步文件</p>
            </div>

            <div class="login-error" id="login-error"></div>
            <div class="login-success" id="login-success"></div>

            <form id="register-form" method="POST" action="/api/register">
                <div class="form-field">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" autocomplete="email" inputmode="email" spellcheck="false" placeholder="you@example.com" required autofocus>
                </div>
                <div class="form-field">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder="至少 8 位，含字母和数字" required>
                </div>
                <div class="form-field">
                    <label for="confirm-password">确认密码</label>
                    <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="login-btn" id="login-btn">注册</button>
            </form>

            <div class="login-links">
                已有账号？<a href="/web/v2/login.html">立即登录</a>
            </div>

            <div class="login-footer">HTTPS · JWT · BCRYPT<br>
                <a href="/web/register.html" class="auth-back-home">切换到经典版界面</a>
            </div>
        </div>
    </div>

    <script src="/web/js/lib/jsencrypt.min.js"></script>
    <script src="/web/js/crypto.js?v=20260803"></script>
    <script src="/web/v2/v2-config.js"></script>
    <script src="/web/js/register.js?v=20260803"></script>
</body>
</html>
