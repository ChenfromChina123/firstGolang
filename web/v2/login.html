<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563EB">
    <script src="/web/v2/theme.js"></script>
    <title>FileSync · 登录</title>
    <link rel="icon" href="/web/img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/web/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/v2/style.css?v=20260809-dark">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <img src="/web/img/logo.svg" alt="FileSync logo" class="login-logo">
                <h2>欢迎回来</h2>
                <p>登录您的 FileSync 文件同步空间</p>
            </div>

            <div class="login-notice" id="login-notice"></div>

            <div class="login-error" id="login-error"></div>

            <form id="login-form" method="POST" action="/api/login">
                <div class="form-field">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" autocomplete="username" inputmode="text" spellcheck="false" required autofocus>
                </div>
                <div class="form-field">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn" id="login-btn">登录</button>
            </form>

            <div class="login-links">
                <a href="/web/v2/register.html">注册账号</a>
                <span style="color:var(--color-text-3)">·</span>
                <a href="/web/v2/forgot-password.html">忘记密码</a>
            </div>

            <div class="login-footer">HTTPS · JWT · BCRYPT<br>
                <a href="/web/login.html" class="auth-back-home">切换到经典版界面</a>
            </div>
        </div>
    </div>

    <script src="/web/js/lib/jsencrypt.min.js"></script>
    <script src="/web/js/crypto.js?v=20260803"></script>
    <script src="/web/v2/v2-config.js"></script>
    <script src="/web/js/login.js?v=20260803"></script>
</body>
</html>
