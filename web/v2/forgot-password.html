<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563EB">
    <script src="/web/v2/theme.js"></script>
    <title>FileSync · 忘记密码</title>
    <link rel="icon" href="/web/img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/web/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/v2/style.css?v=20260809-dark">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <img src="/web/img/logo.svg" alt="FileSync logo" class="login-logo">
                <h2>忘记密码</h2>
                <p>输入注册邮箱，我们将发送 6 位验证码</p>
            </div>

            <div class="login-error" id="login-error"></div>
            <div class="login-success" id="login-success"></div>

            <form id="forgot-form" method="POST" action="/api/forgot-password">
                <div class="form-field">
                    <label for="email">注册邮箱</label>
                    <input type="email" id="email" name="email" autocomplete="email" inputmode="email" spellcheck="false" placeholder="you@example.com" required autofocus>
                </div>
                <button type="submit" class="login-btn" id="login-btn">发送验证码</button>
            </form>

            <div class="login-links">
                <a href="/web/v2/login.html">返回登录</a>
                <span style="color:var(--color-text-3)">·</span>
                <a href="/web/v2/register.html">注册新账号</a>
            </div>

            <div class="login-footer">HTTPS · JWT · BCRYPT<br>
                <a href="/web/forgot-password.html" class="auth-back-home">切换到经典版界面</a>
            </div>
        </div>
    </div>

    <script src="/web/v2/v2-config.js"></script>
    <script src="/web/js/forgot-password.js?v=20260803"></script>
</body>
</html>
