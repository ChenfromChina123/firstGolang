<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">
    <title>FileSync · 账号激活</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/style.css?v=20260706g">
    <style>
        .login-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(63, 185, 80, 0.05) 0%, transparent 50%),
                var(--bg-0);
            padding: 20px;
        }
        .login-card {
            width: 100%; max-width: 440px; background: var(--bg-1);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 48px 32px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border-soft);
            text-align: center;
        }
        .status-icon {
            width: 64px; height: 64px; margin: 0 auto 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .status-icon.success { background: rgba(63, 185, 80, 0.15); color: var(--ok); }
        .status-icon.error { background: var(--err-dim); color: var(--err); }
        .status-icon.loading { background: var(--accent-dim); color: var(--accent); }
        .status-icon svg { width: 32px; height: 32px; }
        .status-title {
            font-family: var(--sans); font-weight: 700; font-size: 22px;
            color: var(--fg-0); margin-bottom: 12px; letter-spacing: 0.5px;
        }
        .status-message {
            font-family: var(--mono); font-size: 13px; color: var(--fg-2);
            line-height: 1.7; margin-bottom: 28px;
        }
        .action-btn {
            display: inline-block; background: var(--accent); color: var(--bg-0);
            text-decoration: none; padding: 12px 32px; border-radius: var(--radius-sm);
            font-family: var(--sans); font-weight: 600; font-size: 14px; letter-spacing: 0.5px;
            transition: background 0.15s, transform 0.1s;
        }
        .action-btn:hover { background: #33e0ff; box-shadow: 0 0 16px var(--accent-glow); }
        .action-btn:active { transform: scale(0.98); }
        .action-link {
            display: inline-block; margin-top: 16px; color: var(--accent);
            text-decoration: none; font-family: var(--mono); font-size: 12px;
        }
        .action-link:hover { text-decoration: underline; }
        .resend-form {
            margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-soft);
        }
        .resend-form input {
            width: 100%; background: var(--bg-2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 10px 12px; color: var(--fg-0);
            font-family: var(--mono); font-size: 13px; margin-bottom: 12px;
        }
        .resend-form input:focus { outline: none; border-color: var(--accent); }
        .resend-btn {
            width: 100%; background: var(--bg-2); color: var(--accent);
            border: 1px solid var(--accent); border-radius: var(--radius-sm);
            padding: 10px; font-family: var(--sans); font-weight: 500; font-size: 13px;
            cursor: pointer; transition: background 0.15s;
        }
        .resend-btn:hover { background: var(--accent-dim); }
        .resend-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card" id="card">
            <!-- 内容由 JS 动态渲染 -->
        </div>
    </div>

    <script src="/web/js/activate.js"></script>
</body>
</html>
