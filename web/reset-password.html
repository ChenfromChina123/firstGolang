<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileSync · 重置密码</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/style.css?v=20260706c">
    <style>
        .login-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(63, 185, 80, 0.05) 0%, transparent 50%),
                var(--bg-0);
            padding: 20px;
        }
        .login-card {
            width: 100%; max-width: 400px; background: var(--bg-1);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 40px 32px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border-soft);
        }
        .login-brand { text-align: center; margin-bottom: 32px; }
        .login-brand svg { color: var(--accent); filter: drop-shadow(0 0 12px var(--accent-glow)); }
        .login-brand h1 {
            font-family: var(--sans); font-weight: 800; font-size: 24px;
            color: var(--fg-0); margin-top: 12px; letter-spacing: 0.5px;
        }
        .login-brand .sub {
            font-family: var(--mono); font-size: 11px; color: var(--fg-3);
            letter-spacing: 2px; margin-top: 4px;
        }
        .login-form .field { margin-bottom: 20px; }
        .login-form label {
            display: block; font-family: var(--mono); font-size: 12px;
            color: var(--fg-2); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .login-form input {
            width: 100%; background: var(--bg-2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px 14px; color: var(--fg-0);
            font-family: var(--mono); font-size: 14px; transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .login-form input::placeholder { color: var(--fg-3); }
        .login-form input.code-input {
            letter-spacing: 8px; text-align: center; font-size: 18px; font-weight: 700;
        }
        .login-btn {
            width: 100%; background: var(--accent); color: var(--bg-0);
            border: none; border-radius: var(--radius-sm); padding: 12px;
            font-family: var(--sans); font-weight: 600; font-size: 15px;
            cursor: pointer; transition: background 0.15s, transform 0.1s; letter-spacing: 0.5px;
        }
        .login-btn:hover { background: #33e0ff; box-shadow: 0 0 16px var(--accent-glow); }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-error {
            background: var(--err-dim); border: 1px solid var(--err);
            border-radius: var(--radius-sm); padding: 10px 14px; color: var(--err);
            font-family: var(--mono); font-size: 13px; margin-bottom: 20px; display: none;
        }
        .login-error.show { display: block; }
        .login-success {
            background: rgba(63, 185, 80, 0.1); border: 1px solid var(--ok);
            border-radius: var(--radius-sm); padding: 14px; color: var(--ok);
            font-family: var(--mono); font-size: 13px; margin-bottom: 20px; display: none;
            line-height: 1.6;
        }
        .login-success.show { display: block; }
        .login-success a { color: var(--accent); text-decoration: none; }
        .login-success a:hover { text-decoration: underline; }
        .login-links {
            text-align: center; margin-top: 24px; font-family: var(--mono);
            font-size: 12px; color: var(--fg-3); letter-spacing: 0.5px;
        }
        .login-links a { color: var(--accent); text-decoration: none; }
        .login-links a:hover { text-decoration: underline; }
        .login-footer {
            text-align: center; margin-top: 24px; font-family: var(--mono);
            font-size: 11px; color: var(--fg-3); letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <svg width="40" height="40" viewBox="0 0 28 28" fill="none">
                    <path d="M4 14L14 4L24 14L14 24L4 14Z" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M9 14L14 9L19 14L14 19L9 14Z" fill="currentColor" opacity="0.6"/>
                </svg>
                <h1>FileSync</h1>
                <div class="sub">CHUNKED · SYNC · CONSOLE</div>
            </div>

            <div class="login-error" id="login-error"></div>
            <div class="login-success" id="login-success"></div>

            <form class="login-form" id="reset-form">
                <div class="field">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="code">验证码（6 位数字）</label>
                    <input type="text" id="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" class="code-input" placeholder="000000" required>
                </div>
                <div class="field">
                    <label for="password">新密码</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder="至少 8 位，含字母和数字" required>
                </div>
                <div class="field">
                    <label for="confirm-password">确认新密码</label>
                    <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="login-btn" id="login-btn">重置密码</button>
            </form>

            <div class="login-links">
                <a href="/web/login.html">返回登录</a>　·　
                <a href="/web/forgot-password.html">重新发送验证码</a>
            </div>

            <div class="login-footer">HTTPS · JWT · BCRYPT</div>
        </div>
    </div>

    <script>
        // 自动从 URL 参数填充 email
        const params = new URLSearchParams(window.location.search);
        const presetEmail = params.get('email');
        if (presetEmail) {
            document.getElementById('email').value = presetEmail;
            document.getElementById('code').focus();
        }

        const form = document.getElementById('reset-form');
        const errorBox = document.getElementById('login-error');
        const successBox = document.getElementById('login-success');
        const submitBtn = document.getElementById('login-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');
            successBox.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = '重置中...';

            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('code').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!email || !code || !password || !confirmPassword) {
                showError('请填写所有字段');
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
                return;
            }
            if (!/^\d{6}$/.test(code)) {
                showError('验证码必须为 6 位数字');
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
                return;
            }
            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
                return;
            }
            if (password.length < 8) {
                showError('密码至少 8 位');
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
                return;
            }

            try {
                const resp = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email, code,
                        new_password: password,
                        confirm_password: confirmPassword
                    }),
                    credentials: 'same-origin'
                });
                const data = await resp.json().catch(() => ({}));

                if (resp.ok && data.success) {
                    successBox.innerHTML = (data.message || '密码已重置') + '<br><br>' +
                        '<a href="/web/login.html?reset=1">前往登录 →</a>';
                    successBox.classList.add('show');
                    form.style.display = 'none';
                } else {
                    showError(data.message || '重置失败');
                }
            } catch (err) {
                showError('网络错误：' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
            }
        });

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('show');
        }
    </script>
</body>
</html>
