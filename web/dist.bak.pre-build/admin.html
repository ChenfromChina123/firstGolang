<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e14"><meta name="color-scheme" content="dark"><title>FileSync · 管理后台</title><link rel="icon" href="/web/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/web/img/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/web/style.css?v=20260709b"><style>body{background:#0a0e14;color:#c8d3e0;font-family:Outfit,sans-serif}.admin-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #1c2536;background:linear-gradient(135deg,#0d1320 0,#0a0e14 100%)}.admin-header .left{display:flex;align-items:center;gap:16px}.admin-header .back-link{color:#5ae0c8;text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid #1c2536;border-radius:6px;transition:all .2s}.admin-header .back-link:hover{border-color:#5ae0c8;background:rgba(90,224,200,.08)}.admin-header h1{font-size:20px;font-weight:600;margin:0}.admin-header .badge{padding:2px 8px;background:#ff6b9d;color:#fff;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.5px}.admin-header .user-info{font-size:13px;color:#7a8a9e}.tab-nav{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid #1c2536;background:#0d1320}.tab-btn{padding:12px 20px;background:0 0;border:none;color:#7a8a9e;cursor:pointer;font-size:14px;font-family:inherit;border-bottom:2px solid transparent;transition:all .2s}.tab-btn:hover{color:#c8d3e0}.tab-btn.active{color:#5ae0c8;border-bottom-color:#5ae0c8}.tab-content{padding:24px;max-width:1400px;margin:0 auto}.tab-pane{display:none}.tab-pane.active{display:block}.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}.stat-card{padding:20px;border:1px solid #1c2536;border-radius:10px;background:linear-gradient(135deg,#0f1623 0,#0a0e14 100%)}.stat-card .label{font-size:12px;color:#7a8a9e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.stat-card .value{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#5ae0c8}.stat-card .sub{font-size:12px;color:#7a8a9e;margin-top:4px}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th{text-align:left;padding:10px 12px;color:#7a8a9e;font-weight:500;border-bottom:1px solid #1c2536;font-size:12px;text-transform:uppercase;letter-spacing:.5px}.data-table td{padding:10px 12px;border-bottom:1px solid #141c28;color:#c8d3e0}.data-table tr:hover td{background:rgba(90,224,200,.03)}.status-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}.status-active{background:rgba(90,224,200,.15);color:#5ae0c8}.status-disabled{background:rgba(255,107,157,.15);color:#ff6b9d}.status-pending{background:rgba(255,193,7,.15);color:#ffc107}.btn{padding:5px 10px;border:1px solid #1c2536;background:0 0;color:#c8d3e0;border-radius:5px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s;margin-right:4px}.btn:hover{border-color:#5ae0c8;color:#5ae0c8}.btn-danger{border-color:#ff6b9d;color:#ff6b9d}.btn-danger:hover{background:rgba(255,107,157,.1)}.btn-primary{border-color:#5ae0c8;color:#5ae0c8}.btn-primary:hover{background:rgba(90,224,200,.1)}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}.modal-overlay.show{display:flex}.modal{background:#0d1320;border:1px solid #1c2536;border-radius:10px;padding:24px;min-width:380px;max-width:90vw}.modal h3{margin:0 0 16px;font-size:16px}.modal input{width:100%;padding:8px 12px;background:#0a0e14;border:1px solid #1c2536;border-radius:6px;color:#c8d3e0;font-family:inherit;font-size:14px;margin-bottom:12px;box-sizing:border-box}.modal input:focus{outline:0;border-color:#5ae0c8}.modal-actions{display:flex;gap:8px;justify-content:flex-end}.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;background:#0d1320;border:1px solid #1c2536;border-radius:8px;color:#c8d3e0;font-size:14px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}.toast.success{border-color:#5ae0c8;color:#5ae0c8}.toast.error{border-color:#ff6b9d;color:#ff6b9d}.loading{text-align:center;padding:40px;color:#7a8a9e}.empty-state{text-align:center;padding:40px;color:#7a8a9e}</style></head><body><header class="admin-header"><div class="left"><a href="/web/index.html" class="back-link">← 返回控制台</a><div class="brand-mark" aria-hidden="true" style="filter:drop-shadow(0 0 8px var(--accent-glow))"><img src="/web/img/logo.svg" width="24" height="24" alt="FileSync logo"></div><h1>管理后台</h1><span class="badge">ADMIN</span></div><div class="user-info" id="admin-user-info">—</div></header><nav class="tab-nav"><button class="tab-btn active" data-tab="stats">系统总览</button> <button class="tab-btn" data-tab="users">用户管理</button> <button class="tab-btn" data-tab="files">文件管理</button> <button class="tab-btn" data-tab="shares">分享管理</button></nav><div class="tab-content"><div class="tab-pane active" id="pane-stats"><div class="stats-grid" id="stats-grid"><div class="loading">加载中...</div></div></div><div class="tab-pane" id="pane-users"><div style="margin-bottom:16px"><button class="btn btn-primary" id="btn-refresh-users" type="button">刷新</button></div><div id="users-table-wrapper"><div class="loading">加载中...</div></div></div><div class="tab-pane" id="pane-files"><div style="margin-bottom:16px"><button class="btn btn-primary" id="btn-refresh-files" type="button">刷新</button> <span style="color:#7a8a9e;font-size:13px;margin-left:12px">显示所有用户的文件</span></div><div id="files-table-wrapper"><div class="loading">点击"刷新"加载文件列表</div></div></div><div class="tab-pane" id="pane-shares"><div style="margin-bottom:16px"><button class="btn btn-primary" id="btn-refresh-shares" type="button">刷新</button></div><div id="shares-table-wrapper"><div class="loading">加载中...</div></div></div></div><div class="modal-overlay" id="reset-pwd-modal"><div class="modal"><h3>重置用户密码</h3><p style="color:#7a8a9e;font-size:13px;margin:0 0 12px">用户：<span id="reset-pwd-username" style="color:#5ae0c8"></span></p><input type="password" id="reset-pwd-input" placeholder="输入新密码（至少 8 位，含大小写和数字）"><div class="modal-actions"><button class="btn" id="btn-cancel-reset-pwd" type="button">取消</button> <button class="btn btn-primary" id="btn-confirm-reset-pwd" type="button">确认重置</button></div></div></div><div class="toast" id="toast"></div><script src="/web/js/lib/jsencrypt.min.js"></script><script src="/web/js/crypto.js?v=20260803"></script><script src="/web/admin.js?v=20260803"></script></body></html>
