<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e14"><meta name="color-scheme" content="dark"><title>FileSync · 重置密码</title><link rel="icon" href="/web/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/web/img/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/web/style.css?v=20260706g"><style>.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 20% 30%,rgba(0,217,255,.08) 0,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(63,185,80,.05) 0,transparent 50%),var(--bg-0);padding:20px}.login-card{width:100%;max-width:400px;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius);padding:40px 32px;box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 0 1px var(--border-soft)}.login-brand{text-align:center;margin-bottom:32px}.login-brand img{width:56px;height:56px;filter:drop-shadow(0 0 16px var(--accent-glow));transition:transform .3s ease}.login-brand img:hover{transform:scale(1.08) rotate(2deg)}.login-brand h1{font-family:var(--sans);font-weight:800;font-size:24px;color:var(--fg-0);margin-top:12px;letter-spacing:.5px}.login-brand .sub{font-family:var(--mono);font-size:11px;color:var(--fg-3);letter-spacing:2px;margin-top:4px}.login-form .field{margin-bottom:20px}.login-form label{display:block;font-family:var(--mono);font-size:12px;color:var(--fg-2);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}.login-form input{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--fg-0);font-family:var(--mono);font-size:14px;transition:border-color .15s,box-shadow .15s}.login-form input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}.login-form input::placeholder{color:var(--fg-3)}.login-form input.code-input{letter-spacing:8px;text-align:center;font-size:18px;font-weight:700}.login-btn{width:100%;background:var(--accent);color:var(--bg-0);border:none;border-radius:var(--radius-sm);padding:12px;font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s,transform .1s;letter-spacing:.5px}.login-btn:hover{background:#33e0ff;box-shadow:0 0 16px var(--accent-glow)}.login-btn:active{transform:scale(.98)}.login-btn:disabled{opacity:.6;cursor:not-allowed}.login-error{background:var(--err-dim);border:1px solid var(--err);border-radius:var(--radius-sm);padding:10px 14px;color:var(--err);font-family:var(--mono);font-size:13px;margin-bottom:20px;display:none}.login-error.show{display:block}.login-success{background:rgba(63,185,80,.1);border:1px solid var(--ok);border-radius:var(--radius-sm);padding:14px;color:var(--ok);font-family:var(--mono);font-size:13px;margin-bottom:20px;display:none;line-height:1.6}.login-success.show{display:block}.login-success a{color:var(--accent);text-decoration:none}.login-success a:hover{text-decoration:underline}.login-links{text-align:center;margin-top:24px;font-family:var(--mono);font-size:12px;color:var(--fg-3);letter-spacing:.5px}.login-links a{color:var(--accent);text-decoration:none}.login-links a:hover{text-decoration:underline}.login-footer{text-align:center;margin-top:24px;font-family:var(--mono);font-size:11px;color:var(--fg-3);letter-spacing:1px}</style></head><body><div class="login-wrap"><div class="login-card"><div class="login-brand"><img src="/web/img/logo.svg" alt="FileSync logo"><h1>FileSync</h1><div class="sub">CHUNKED · SYNC · CONSOLE</div></div><div class="login-error" id="login-error"></div><div class="login-success" id="login-success"></div><form class="login-form" id="reset-form" method="POST" action="/api/reset-password"><div class="field"><label for="email">邮箱</label> <input type="email" id="email" name="email" autocomplete="email" inputmode="email" spellcheck="false" required></div><div class="field"><label for="code">验证码（6 位数字）</label> <input type="text" id="code" name="code" inputmode="numeric" spellcheck="false" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" class="code-input" placeholder="000000" required></div><div class="field"><label for="password">新密码</label> <input type="password" id="password" name="password" autocomplete="new-password" placeholder="至少 8 位，含字母和数字" required></div><div class="field"><label for="confirm-password">确认新密码</label> <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required></div><button type="submit" class="login-btn" id="login-btn">重置密码</button></form><div class="login-links"><a href="/web/login.html">返回登录</a>　·　 <a href="/web/forgot-password.html">重新发送验证码</a></div><div class="login-footer">HTTPS · JWT · BCRYPT</div></div></div><script src="/web/js/lib/jsencrypt.min.js"></script><script src="/web/js/crypto.js?v=20260803"></script><script src="/web/js/reset-password.js?v=20260803"></script></body></html>
