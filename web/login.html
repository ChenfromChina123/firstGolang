<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0e14">
    <meta name="color-scheme" content="dark">
    <title>FileSync · 登录</title>
    <link rel="icon" href="/web/img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/web/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/style.css?v=20260706g">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(63, 185, 80, 0.05) 0%, transparent 50%),
                var(--bg-0);
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border-soft);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-brand img {
            width: 56px;
            height: 56px;
            filter: drop-shadow(0 0 16px var(--accent-glow));
            transition: transform 0.3s ease;
        }
        .login-brand img:hover {
            transform: scale(1.08) rotate(2deg);
        }
        .login-brand h1 {
            font-family: var(--sans);
            font-weight: 800;
            font-size: 24px;
            color: var(--fg-0);
            margin-top: 12px;
            letter-spacing: 0.5px;
        }
        .login-brand .sub {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--fg-3);
            letter-spacing: 2px;
            margin-top: 4px;
        }
        .login-form .field {
            margin-bottom: 20px;
        }
        .login-form label {
            display: block;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--fg-2);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .login-form input {
            width: 100%;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            color: var(--fg-0);
            font-family: var(--mono);
            font-size: 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .login-form input::placeholder {
            color: var(--fg-3);
        }
        .login-btn {
            width: 100%;
            background: var(--accent);
            color: var(--bg-0);
            border: none;
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: var(--sans);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            letter-spacing: 0.5px;
        }
        .login-btn:hover {
            background: #33e0ff;
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .login-btn:active {
            transform: scale(0.98);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-error {
            background: var(--err-dim);
            border: 1px solid var(--err);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--err);
            font-family: var(--mono);
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .login-error.show {
            display: block;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--fg-3);
            letter-spacing: 1px;
        }
        .login-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-family: var(--mono);
            font-size: 12px;
        }
        .login-links a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.15s;
        }
        .login-links a:hover { color: var(--fg-0); text-decoration: underline; }
        .login-links .sep { color: var(--fg-3); }
        .login-notice {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-size: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .login-notice.show { display: block; }
        .login-notice.success {
            background: rgba(63, 185, 80, 0.12);
            border: 1px solid var(--ok);
            color: var(--ok);
        }
        .login-notice.error {
            background: var(--err-dim);
            border: 1px solid var(--err);
            color: var(--err);
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <img src="/web/img/logo.svg" alt="FileSync logo">
                <h1>FileSync</h1>
                <div class="sub">CHUNKED · SYNC · CONSOLE</div>
            </div>

            <div class="login-notice" id="login-notice"></div>

            <div class="login-error" id="login-error"></div>

            <form class="login-form" id="login-form" method="POST" action="/api/login">
                <div class="field">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" autocomplete="username" inputmode="text" spellcheck="false" required autofocus>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn" id="login-btn">登录</button>
            </form>

            <div class="login-links">
                <a href="/web/register.html">注册账号</a>
                <span class="sep">·</span>
                <a href="/web/forgot-password.html">忘记密码</a>
            </div>

            <div class="login-footer">HTTPS · JWT · BCRYPT</div>
        </div>
    </div>

    <script src="/web/js/lib/jsencrypt.min.js"></script>
    <script src="/web/js/crypto.js"></script>
    <script src="/web/js/login.js"></script>
</body>
</html>
